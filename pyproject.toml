[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-size-report"
version = "1.0.0"
description = "Scan a folder and generate readable size summaries, top-file lists, JSON, and CSV reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GitHub Content Pack Contributor" }]
dependencies = []
keywords = ["python", "cli", "disk-usage", "file-management", "reporting"]

[project.scripts]
folder-report = "folder_size_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
